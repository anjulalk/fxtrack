name: deploy

# Code pushes rebuild the site from whatever data is already committed.
# Bot data commits use GITHUB_TOKEN, which does not retrigger workflows.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Snapshot
        run: npm run snap

      - name: Build
        env:
          # Served from the root of the custom subdomain (see public/CNAME).
          BASE_PATH: /
          SITE_URL: https://fxtrack.anjula.dev
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

      - id: pages
        uses: actions/deploy-pages@v4
