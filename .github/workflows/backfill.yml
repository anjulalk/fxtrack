name: backfill

# CBSL publishes its history as a running workbook that trails the current day by
# a few days. Running daily keeps the baseline within ~1-3 days instead of letting
# it drift up to a month. It rewrites the cbsl rows in data/day.csv and leaves bank
# rows alone.
#
# Scheduled 30 min before the first tick of the day: this job only commits data,
# and tick.yml is what rebuilds the snapshots and deploys, so landing just ahead of
# it gets the new baseline on screen in the same cycle.
on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Backfill CBSL
        run: npm run backfill

      - name: Commit data
        run: |
          git config user.name 'fxtrack bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'no new cbsl history'
          else
            git commit -m "data: cbsl backfill $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
