name: tick

on:
  schedule:
    # GitHub's schedule queue is best-effort: runs can be delayed for hours or
    # dropped silently under load. Each publication window is therefore hit
    # several times so a missed run is covered by the next. The primary times
    # are 09:40, 12:40, 15:40 and 18:40 Sri Lanka time (UTC+5:30) — the morning
    # publication, midday revisions and the close.
    - cron: '10 4,7,10,13 * * *' # primary
    - cron: '40 4,7,10,13 * * *' # +30m backup
    - cron: '10 5,8,11,14 * * *' # +1h backup
    - cron: '25 5,8,11,14 * * *' # +1h15m backup
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Scrape
        env:
          # Optional relay for sources whose WAF blocks GitHub's egress IPs.
          # Unset falls back to the keyless reader (see packages/worker/src/lib/net.ts).
          FX_PROXY: ${{ secrets.FX_PROXY }}
        run: npm run tick

      - name: Commit data
        run: |
          git config user.name 'fxtrack bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'rates unchanged'
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%MZ')"
            git push
          fi

      - name: Snapshot
        run: npm run snap

      - name: Build
        env:
          # Served from the root of the custom subdomain (see public/CNAME).
          BASE_PATH: /
          SITE_URL: https://fxtrack.anjula.dev
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

      - id: pages
        uses: actions/deploy-pages@v5
