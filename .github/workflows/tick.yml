name: tick

on:
  schedule:
    # 09:40, 12:40, 15:40 and 18:40 Sri Lanka time (UTC+5:30) — covers the
    # morning publication, midday revisions and the close.
    - cron: '10 4,7,10,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Scrape
        run: npm run tick

      - name: Commit data
        run: |
          git config user.name 'fxtrack bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'rates unchanged'
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%MZ')"
            git push
          fi

      - name: Snapshot
        run: npm run snap

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          command: deploy
